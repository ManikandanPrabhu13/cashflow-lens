# CashFlow-Lens configuration.
# All data is SYNTHETIC. Risk thresholds below are illustrative and
# configurable; they are NOT universal banking standards.

project:
  name: CashFlow-Lens
  version: 0.1.0

seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  models: models
  artifacts: artifacts
  database: data/cashflow_lens.db

data:
  n_borrowers: 600
  n_months: 24
  start_date: "2023-01-01"
  loan_application_lookback_days: 45
  enterprise_sizes:
    Micro: 0.55
    Small: 0.33
    Medium: 0.12
  sectors:
    Retail: 0.28
    Manufacturing: 0.22
    Services: 0.20
    Agri-processing: 0.12
    Logistics: 0.10
    Hospitality: 0.08
  regions:
    North: 0.22
    South: 0.28
    East: 0.16
    West: 0.24
    Central: 0.10
  inconsistency_scenario_rate: 0.12
  demo_borrowers: 5

features:
  observation_months: 18   # history window used to build features
  outcome_months: 6        # later window used only to define the target
  min_balance_floor: 0.0

evidence:
  amount_tolerance_pct: 0.02
  date_tolerance_days: 10
  near_duplicate_amount_pct: 0.01
  near_duplicate_days: 7
  gst_amount_tolerance_pct: 0.05
  inventory_quantity_tolerance_pct: 0.10
  new_counterparty_days: 60
  round_amount_modulus: 1000
  liquidity_spike_zscore: 2.5
  round_trip_window_days: 14
  weights:
    bank_invoice_match: 0.25
    gst_revenue_match: 0.20
    vendor_invoice_match: 0.15
    inventory_purchase_match: 0.15
    duplicate_invoice_signal: 0.10
    transaction_anomaly_signal: 0.15
  review_threshold: 0.60

model:
  test_size: 0.25
  cv_folds: 5
  decision_threshold: 0.5
  logistic:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 10
    class_weight: balanced_subsample
    n_jobs: -1
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbose: -1
  calibration_bins: 10
  serving_model: auto      # auto = best validation ROC-AUC chosen at training time

risk:
  low_max_pd: 0.15         # PD <= this -> Low
  medium_max_pd: 0.35      # PD <= this -> Medium, otherwise High
  top_n_drivers: 5

forecast:
  horizons_days: [30, 60, 90]
  history_months_used: 12
  trend_damping: 0.9
  min_history_months: 6
  liquidity_pressure_low: 1.5
  liquidity_pressure_high: 0.75

fairness:
  protected_attributes:
    - enterprise_size
    - sector
    - region
    - digital_adoption_level
    - credit_history_band
  min_group_size: 30
  min_group_positives: 5
  disparity_flag_threshold: 0.10
  intersections:
    - [enterprise_size, region]
    - [sector, digital_adoption_level]
  proxy_correlation_threshold: 0.30
  mitigation_method: threshold_adjustment
  mitigation_attribute: enterprise_size

stress:
  sales_decline_pct: [0, -10, -20, -30]
  input_cost_increase_pct: [0, 10, 20, 30]
  interest_increase_pct_points: [0, 1, 2, 3]
  opex_increase_pct: 0
  default_scenario:
    sales_decline_pct: 0
    input_cost_increase_pct: 0
    interest_increase_pct_points: 0
    opex_increase_pct: 0

decision:
  manual_review_pd: 0.35
  manual_review_evidence_score: 0.60
  manual_review_stress_migration: true

api:
  host: 127.0.0.1
  port: 8000
  cors_origins: ["*"]

logging:
  level: INFO